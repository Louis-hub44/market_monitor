  # -------------------------------------------------------------------- taux
  # Génériques Bloomberg (rendements en %). Fallback gratuit : rendements génériques Stooq
  # (stooq:<maturité><pays>y.b, en %, à vérifier), une seule source pour les quatre pays afin
  # que les spreads restent cohérents. "a|b" = chaîne de secours : si Stooq est bloqué (pare-feu
  # d'entreprise), le Bund passe sur la courbe officielle de la Bundesbank (zéro-coupon
  # Svensson, quelques pb d'écart avec le générique), signalée en avertissement.
  BUND_2Y:   {name: Bund 2 ans,  class: rates, group: Allemagne,
              tickers: {bloomberg: GDBR2 Index, free: "stooq:2dey.b|bbk:BBSIS/D.I.ZST.ZI.EUR.S1311.B.A604.R02XX.R.A.A._Z._Z.A"}}
  BUND_5Y:   {name: Bund 5 ans,  class: rates, group: Allemagne,
              tickers: {bloomberg: GDBR5 Index, free: "stooq:5dey.b|bbk:BBSIS/D.I.ZST.ZI.EUR.S1311.B.A604.R05XX.R.A.A._Z._Z.A"}}
