# Référentiel d'instruments du Market Monitor.
#
# Chaque instrument : identifiant canonique (MAJUSCULES), nom, classe d'actifs, groupe
# d'affichage, type de cotation, unité, et ticker natif par provider.
#
#   quote  : price  -> variations en %          (actions, FX, matières premières, crypto)
#            yield  -> niveau en %, variations en pb (x100)
#            spread -> niveau en pb, variations en pb
#            vol    -> niveau en points de vol, variations en points (surchargeable : change: pct)
#   ticker : soit une chaîne, soit {ticker, scale, proxy}
#            scale : facteur appliqué pour ramener la source à l'unité du référentiel
#            proxy : description si la source n'est PAS l'instrument exact (ETF, future...) ;
#                    pour une chaîne "a|b", {alternative: description} ne signale que celles-ci
#   derived: combinaison linéaire d'autres instruments (spreads, pentes, papillons)
#            niveau = multiplier x somme(weight_i x niveau_i), dates communes uniquement
#   roll   : calendrier d'échéance d'un future générique front-month (brent | wti | ttf) :
#            le 1J du jour de changement de contrat est signalé et exclu des mouvements,
#            des alertes et de l'estimation de la volatilité
#
# Tickers marqués "à vérifier" : à contrôler sur le Terminal / la source avant production.

version: 1

defaults:
  equity:      {quote: price, unit: pts}
  rates:       {quote: yield, unit: "%"}
  credit:      {quote: spread, unit: pb}
  fx:          {quote: price, unit: ""}
  commodities: {quote: price}
  volatility:  {quote: vol, unit: pts}
  crypto:      {quote: price, unit: USD}

