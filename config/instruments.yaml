                 quote: spread, unit: pb,
                 derived: {multiplier: 100, legs: {BTP_10Y: 1, BUND_10Y: -1}}}
  BUND_2S10S:   {name: Pente Bund 2s10s, class: rates, group: Pentes, quote: spread, unit: pb,
                 derived: {multiplier: 100, legs: {BUND_10Y: 1, BUND_2Y: -1}}}
  BUND_5S30S:   {name: Pente Bund 5s30s, class: rates, group: Pentes, quote: spread, unit: pb,
                 derived: {multiplier: 100, legs: {BUND_30Y: 1, BUND_5Y: -1}}}
