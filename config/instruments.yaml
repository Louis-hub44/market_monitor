  # Spreads et pentes (en pb), calculés à partir des rendements
  OAT_BUND_10Y: {name: Spread OAT-Bund 10 ans, class: rates, group: Spreads souverains,
                 quote: spread, unit: pb,
                 derived: {multiplier: 100, legs: {OAT_10Y: 1, BUND_10Y: -1}}}
