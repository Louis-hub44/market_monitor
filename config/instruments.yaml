  BUND_30Y:  {name: Bund 30 ans, class: rates, group: Allemagne,
              tickers: {bloomberg: GDBR30 Index, free: "cnbc:DE30Y-DE|stooq:30dey.b|bbk:BBSIS/D.I.ZST.ZI.EUR.S1311.B.A604.R30XX.R.A.A._Z._Z.A"}}
