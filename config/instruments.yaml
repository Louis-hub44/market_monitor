  # -------------------------------------------------------------------- taux
  # Génériques Bloomberg (rendements en %). Fallback gratuit en chaîne "a|b|c" (la première
  # source qui répond l'emporte, un repli est signalé en avertissement) :
  #   1. CNBC (cnbc:<PAYS><n>Y-<PAYS>, en %) - même source pour les quatre pays, spreads cohérents ;
  #   2. Stooq (stooq:<n><pays>y.b) - souvent derrière une page anti-robot ;
  #   3. Bund uniquement : courbe officielle de la Bundesbank (zéro-coupon Svensson, quelques
  #      pb d'écart avec le générique : les spreads contre OAT / BTP en sont légèrement biaisés).
  BUND_2Y:   {name: Bund 2 ans,  class: rates, group: Allemagne,
              tickers: {bloomberg: GDBR2 Index, free: "cnbc:DE2Y-DE|stooq:2dey.b|bbk:BBSIS/D.I.ZST.ZI.EUR.S1311.B.A604.R02XX.R.A.A._Z._Z.A"}}
  BUND_5Y:   {name: Bund 5 ans,  class: rates, group: Allemagne,
              tickers: {bloomberg: GDBR5 Index, free: "cnbc:DE5Y-DE|stooq:5dey.b|bbk:BBSIS/D.I.ZST.ZI.EUR.S1311.B.A604.R05XX.R.A.A._Z._Z.A"}}
