# Rates & Bond Analytics – configuration
# Secrets go in .env (copy .env.example). ${VAR} / ${VAR:-default} are read from the environment.

# Corporate network (SSL-inspection proxy such as Zscaler / Netskope). All requests go through the
# terminal's single session (core/terminal_core/network.py); certificate verification is ALWAYS on.
#   auto     : OS certificate store (truststore) + ca_bundle if given, else ca_bundle, else certifi (default)
#   system   : OS certificate store (where IT installs the proxy CA), + ca_bundle if given
#   ca       : explicit corporate root certificate (ca_bundle: path to .pem / .crt), merged with certifi
#   standard : public certificates only (certifi), home / public network
# Environment overrides (.env): TERMINAL_TRUST, TERMINAL_CA_BUNDLE, TERMINAL_HTTPS_PROXY, TERMINAL_NO_PROXY
# (legacy RATES_NETWORK_MODE / RATES_CA_BUNDLE / MARKET_MONITOR_CA_BUNDLE / REQUESTS_CA_BUNDLE still read);
# proxy otherwise from the standard HTTPS_PROXY / NO_PROXY. Diagnostic: check-network.
network:
  mode: auto
  ca_bundle: ""
  proxy: ""              # e.g. http://proxy.company.com:8080 (empty = HTTPS_PROXY)
  no_proxy: ""
  timeout_s: 20

data:
  provider: free            # fmp | free (ECB Data Portal) | public (CNBC/Bundesbank/Stooq/FRED/Yahoo) | file | static
  fallback: [public, file, fmp]   # ordered chain used for ids the primary cannot serve (FMP skipped without key)
  missing_policy: warn      # raise | warn (NaN + log) | drop
  quote_lookback_days: 10   # calendar days searched backwards for the last valid quote
  plausible_rate_range: [-0.05, 0.30]   # decimal; values outside are flagged in the DataReport
  cache:
    enabled: true
    directory: data/cache   # relative to the project root
    ttl_hours_live: 4       # windows that include today
    ttl_days_static: 30     # bond reference data

providers:
  fmp:
    base_url: https://financialmodelingprep.com/stable
    timeout_s: 20
    max_days_per_call: 90   # FMP caps treasury-rates windows
  ecb:
    base_url: https://data-api.ecb.europa.eu/service/data
    timeout_s: 30
  public:
    timeout_s: 20             # FRED API key (optional, fredapi: prefix): FRED_API_KEY in .env
  file:
    root: .                   # CSV / Excel series (file: {path, column, scale}), relative to the project
  static:
    directory: data/sample

# Free sources publish no EUR swap quotes. When the €STR OIS / EURIBOR 6M quotes are missing
# (no swap quote source), the curves are rebuilt as PROXIES from public data, clearly flagged in the UI:
#   €STR OIS zero(T) = ECB AAA Svensson zero(T) + spread(T), the spread going from the €STR
#   fixing at the short end to `ois_minus_aaa_bp` (interpolated in maturity) at the long end;
#   EURIBOR 6M swap(T) = OIS par(T) + `euribor6m_basis_bp`(T); 6M fixing = €STR + basis(6M).
# The spreads are market ASSUMPTIONS (orders of magnitude of 2025-26): adjust them to the
# levels you see on your desk.
proxy_curves:
  enabled: true
  short_end_decay_years: 1.0
  ois_minus_aaa_bp: {1Y: 0, 2Y: -3, 5Y: -8, 10Y: -12, 20Y: -15, 30Y: -18, 50Y: -18}
  euribor6m_basis_bp: {6M: 20, 1Y: 19, 2Y: 17, 5Y: 13, 10Y: 10, 20Y: 7, 30Y: 6, 50Y: 5}

# Logical id -> provider specs. Rates are returned in decimals (scale 0.01 for % quotes).
# Ids without a live source (EUR OIS / IRS / FRA quotes) are served by the static provider
# (CSV files, e.g. an export from your desk) or rebuilt as proxies (proxy_curves above).
market_data:
  EUR.ESTR.FIX:
    description: "€STR fixing (volume-weighted trimmed mean), published T+1 08:00 CET"
    ecb: {key: "EST/B.EU000A2X2A25.WT", scale: 0.01}

  EUR.ESTR.OIS.{tenor}:
    description: "€STR OIS par rate (annual ACT/360, T+2, pay lag 1)"
    tenors: [1W, 2W, 1M, 2M, 3M, 4M, 5M, 6M, 9M, 1Y, 18M, 2Y, 3Y, 4Y, 5Y, 6Y, 7Y, 8Y, 9Y, 10Y, 12Y, 15Y, 20Y, 25Y, 30Y, 40Y, 50Y]

  EUR.EURIBOR6M.FIX:
    description: "EURIBOR 6M fixing"
  EUR.EURIBOR3M.FIX:
    description: "EURIBOR 3M fixing"

  # FRAs on EURIBOR 6M
  EUR.EURIBOR6M.FRA.1X7: {description: "EURIBOR 6M FRA (file / static source)"}
  EUR.EURIBOR6M.FRA.2X8: {description: "EURIBOR 6M FRA (file / static source)"}
  EUR.EURIBOR6M.FRA.3X9: {description: "EURIBOR 6M FRA (file / static source)"}
  EUR.EURIBOR6M.FRA.4X10: {description: "EURIBOR 6M FRA (file / static source)"}
  EUR.EURIBOR6M.FRA.5X11: {description: "EURIBOR 6M FRA (file / static source)"}
  EUR.EURIBOR6M.FRA.6X12: {description: "EURIBOR 6M FRA (file / static source)"}
  EUR.EURIBOR6M.FRA.9X15: {description: "EURIBOR 6M FRA (file / static source)"}
  EUR.EURIBOR6M.FRA.12X18: {description: "EURIBOR 6M FRA (file / static source)"}

  EUR.EURIBOR6M.SWAP.{tenor}:
    description: "EUR IRS vs EURIBOR 6M (fixed annual 30/360)"
    tenors: [2Y, 3Y, 4Y, 5Y, 6Y, 7Y, 8Y, 9Y, 10Y, 12Y, 15Y, 20Y, 25Y, 30Y, 40Y, 50Y]

  EUR.ECB.AAA.SPOT.{tenor}:
    description: "ECB euro-area AAA government spot curve (Svensson fit by the ECB)"
    tenors: [3M, 6M, 9M, 1Y, 2Y, 3Y, 4Y, 5Y, 6Y, 7Y, 8Y, 9Y, 10Y, 15Y, 20Y, 25Y, 30Y]
    ecb: {key: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_{ecb_tenor}", scale: 0.01}

  EUR.ECB.ALL.SPOT.{tenor}:
    description: "ECB euro-area all-issuers government spot curve"
    tenors: [3M, 6M, 1Y, 2Y, 3Y, 5Y, 7Y, 10Y, 15Y, 20Y, 30Y]
    ecb: {key: "YC/B.U2.EUR.4F.G_N_C.SV_C_YM.SR_{ecb_tenor}", scale: 0.01}

  # ECB published Svensson parameters (betas in %, taus in years) – benchmark for phase 4
  EUR.ECB.AAA.NSS.BETA0: {ecb: {key: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.BETA0", scale: 0.01}}
  EUR.ECB.AAA.NSS.BETA1: {ecb: {key: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.BETA1", scale: 0.01}}
  EUR.ECB.AAA.NSS.BETA2: {ecb: {key: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.BETA2", scale: 0.01}}
  EUR.ECB.AAA.NSS.BETA3: {ecb: {key: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.BETA3", scale: 0.01}}
  EUR.ECB.AAA.NSS.TAU1: {ecb: {key: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.TAU1", scale: 1.0}}
  EUR.ECB.AAA.NSS.TAU2: {ecb: {key: "YC/B.U2.EUR.4F.G_N_A.SV_C_YM.TAU2", scale: 1.0}}

  # Sovereign benchmark yields (generic, % ) from keyless public sources, first available wins.
  # Used to fit the sovereign curves when no bond-level data is available (free / FMP modes).
  EUR.GOVT.DE.{tenor}:
    description: "Bund generic yield (CNBC, then Bundesbank Svensson zero curve, then Stooq)"
    tenors: [2Y, 5Y, 10Y, 30Y]
    public: {ticker: "cnbc:DE{tenor}-DE|bbk:BBSIS/D.I.ZST.ZI.EUR.S1311.B.A604.{bbk_tenor}.R.A.A._Z._Z.A|stooq:{years}dey.b", scale: 0.01}
  EUR.GOVT.FR.{tenor}:
    description: "OAT generic yield"
    tenors: [2Y, 5Y, 10Y, 30Y]
    public: {ticker: "cnbc:FR{tenor}-FR|stooq:{years}fry.b", scale: 0.01}
  EUR.GOVT.IT.{tenor}:
    description: "BTP generic yield"
    tenors: [2Y, 5Y, 10Y, 30Y]
    public: {ticker: "cnbc:IT{tenor}-IT|stooq:{years}ity.b", scale: 0.01}
  EUR.GOVT.ES.{tenor}:
    description: "Bonos generic yield"
    tenors: [2Y, 5Y, 10Y, 30Y]
    public: {ticker: "cnbc:ES{tenor}-ES|stooq:{years}esy.b", scale: 0.01}
  # Bundesbank official zero-coupon curve of Federal securities (Svensson), extra Bund pillars
  EUR.BBK.DE.ZERO.{tenor}:
    description: "Bundesbank Svensson zero-coupon yield of listed Federal securities"
    tenors: [1Y, 2Y, 3Y, 5Y, 7Y, 10Y, 15Y, 20Y, 30Y]
    public: {ticker: "bbk:BBSIS/D.I.ZST.ZI.EUR.S1311.B.A604.{bbk_tenor}.R.A.A._Z._Z.A", scale: 0.01}

  USD.UST.CMT.{tenor}:
    description: "US Treasury constant-maturity yields"
    tenors: [1M, 2M, 3M, 6M, 1Y, 2Y, 3Y, 5Y, 7Y, 10Y, 20Y, 30Y]
    fmp: {endpoint: "treasury-rates", field: "{fmp_tenor}", scale: 0.01}

# Sovereign curves (phase 4). For each curve: issuer (convention) and the bond universe:
#   isins: explicit list (production), or
#   file:  CSV with an "isin" column (relative to the project root), or
#   nothing: every bond of that issuer known to the static provider (sample data).
sovereign_curves:
  BUND: {issuer: DE, model: auto, min_maturity_years: 0.25}
  OAT:  {issuer: FR, model: auto, min_maturity_years: 0.25}
  BTP:  {issuer: IT, model: auto, min_maturity_years: 0.25}
# Without bond-level data (free / FMP), each curve is fitted on the generic yields
# EUR.GOVT.<benchmark>.* above (Nelson-Siegel on 4 par bonds, flagged "benchmarks" in the UI).
benchmark_curves: {BUND: DE, OAT: FR, BTP: IT, BONO: ES}
