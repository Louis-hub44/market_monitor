[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rates-analytics"
version = "1.1.0"
description = "Rates & Bond Analytics (GC / SWPM / YAS-like) – module of a home-made mini Bloomberg terminal"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Louis RICO" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "plotly>=5.18",
    "streamlit>=1.46",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pyarrow>=14.0",
    "truststore>=0.9",
    "terminal-core>=0.1",   # monorepo: pip install -e ../core
]

[project.optional-dependencies]
bloomberg = ["blpapi"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "QuantLib>=1.31,<1.44", "ruff>=0.6", "mypy>=1.10", "pandas-stubs", "types-PyYAML", "types-requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra -m 'not network'"
markers = [
    "oracle: comparison against QuantLib (test-only oracle)",
    "network: requires internet access (run with -m network)",
]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["data", "examples/output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF", "C4"]
ignore = ["E741", "RUF001", "RUF002", "RUF003", "B905", "RUF007", "C408", "UP042", "RUF005", "B027"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["B018"]

[tool.ruff.lint.isort]
known-first-party = ["rates_analytics", "app"]

[tool.coverage.run]
source = ["rates_analytics", "app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src/rates_analytics"]
