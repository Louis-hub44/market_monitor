name: market_monitor

on:
  push:
    paths: ['market_monitor/**', '.github/workflows/market_monitor.yml']
  pull_request:
    paths: ['market_monitor/**', '.github/workflows/market_monitor.yml']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: market_monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest --cov=market_monitor --cov-report=term
