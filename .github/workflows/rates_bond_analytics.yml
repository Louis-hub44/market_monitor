name: rates_bond_analytics

on:
  push:
    paths: ['rates_bond_analytics/**', '.github/workflows/rates_bond_analytics.yml']
  pull_request:
    paths: ['rates_bond_analytics/**', '.github/workflows/rates_bond_analytics.yml']

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rates_bond_analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest --cov --cov-report=term
