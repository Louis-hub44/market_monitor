[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stress-engine"
version = "0.1.0"
description = "Moteur de stress tests, scénarios et VaR du terminal (indépendant de l'UI)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "rates-analytics>=1.1",   # monorepo: pip install -e ../rates_bond_analytics
    "terminal-core>=0.1",     # monorepo: pip install -e ../core
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10", "pandas-stubs", "types-PyYAML", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stress_engine = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF", "C4"]
ignore = ["RUF001", "RUF002", "RUF003", "B905", "UP042", "C408"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["stress_engine"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src/stress_engine"]
