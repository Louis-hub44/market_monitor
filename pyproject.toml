[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-monitor"
version = "1.5.3"
description = "Market Monitor - ecran d'accueil multi-actifs du mini terminal (WEI / WB / FXC / CMDTY)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "plotly>=5.18",
    "streamlit>=1.46",
    "pyarrow>=14",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "tzdata>=2024.1",   # indispensable sous Windows pour zoneinfo
    "openpyxl>=3.1",    # export Excel
    "matplotlib>=3.8",  # export PNG hors navigateur
]

[project.optional-dependencies]
dev = [
    "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10",
    "pandas-stubs", "types-requests", "types-PyYAML",
]
# blpapi n'est pas sur PyPI : voir README (index Bloomberg)

[project.scripts]
market-monitor = "market_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E701", "E702", "B905"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
